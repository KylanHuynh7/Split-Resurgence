[project]
name = "split-resurgence"
version = "0.1.0"
description = "Splitter analytics: do run-expectancy models systematically undervalue the splitter?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pybaseball>=2.2.7",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
modeling = [
    "xgboost>=2.0.0",
]
notebook = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
